name: swift
display_name: Swift
service_type: object-store
defaults:
  actions:
  - log
  - delete
  - tag
  checks:
  - status
  - age_gt
  - unused
  - exempt_names
resources:
  container:
    description: Containers
    actions:
    - log
    - delete
    - tag
    checks:
    - unused
    - exempt_names
  object:
    description: Objects
    actions:
    - log
    - delete
    - tag
    checks:
    - age_gt
    - exempt_names
  account:
    description: Accounts
    actions:
    - log
    checks:
    - quota_set
    rich_checks:
      - name: quota_set
        type: bool
        description: "Account has no storage quota configured"
        category: cost
        severity: medium
